name: Build OpenNOW Android APK

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Set up Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Android NDK & CMake
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APKs (Release & Debug)
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Sign Release APK if Unsigned
        shell: bash
        run: |
          RELEASE_DIR="android/app/build/outputs/apk/release"
          if [ -d "$RELEASE_DIR" ]; then
            for f in "$RELEASE_DIR"/*-unsigned.apk; do
              if [ -f "$f" ]; then
                SIGNED_APK="${f/-unsigned.apk/.apk}"
                echo "Signing $f -> $SIGNED_APK with debug key..."
                # Create debug keystore if not present
                mkdir -p ~/.android
                if [ ! -f ~/.android/debug.keystore ]; then
                  keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
                fi
                jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore ~/.android/debug.keystore -storepass android "$f" androiddebugkey
                cp -f "$f" "$SIGNED_APK"
              fi
            done
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opennow-apks
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          name: OpenNOW Android ${{ github.ref_name }}
          draft: false
          prerelease: false
